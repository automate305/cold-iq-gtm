<title>A305 Invoice Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --navy: #1E2A3A;
    --ink: #24303F;
    --ink-soft: #55637A;
    --ink-faint: #8A96A8;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E3E8EF;
    --orange: #E8501F;
    --orange-soft: #FDEEE7;
    --green: #1E7F4F;
    --green-soft: #E6F4EC;
    --focus: #2D6CC0;
    --on-accent: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --navy: #CBD5E1; --ink: #E2E8F0; --ink-soft: #94A3B8; --ink-faint: #64748B;
    --bg: #0F172A; --surface: #1E293B; --border: #334155;
    --orange: #F97316; --orange-soft: #431407; --green: #4ADE80; --green-soft: #052E16;
    --focus: #60A5FA; --on-accent: #FFFFFF; color-scheme: dark;
  }}
  :root[data-theme="dark"] {
    --navy: #CBD5E1; --ink: #E2E8F0; --ink-soft: #94A3B8; --ink-faint: #64748B;
    --bg: #0F172A; --surface: #1E293B; --border: #334155;
    --orange: #F97316; --orange-soft: #431407; --green: #4ADE80; --green-soft: #052E16;
    --focus: #60A5FA; --on-accent: #FFFFFF; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 'Inter', system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .app { max-width: 1120px; margin: 0 auto; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 20px; }
  .header .brand { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--orange); }
  .header h1 { margin: 0; font-size: 20px; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.off { background: var(--orange-soft); color: var(--orange); }

  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
  .rule { height: 1px; background: var(--border); margin: 16px 0; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 76px; line-height: 1.45; }
  .field input:focus, .field textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent); }
  .field input[readonly] { opacity: .7; }
  .hint { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
  .hint.warn { color: var(--orange); font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 11px 16px; font: inherit; font-size: 13px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; background: var(--orange); color: var(--on-accent); }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 12px; color: var(--ink-soft); }
  .total-line b { font-size: 18px; color: var(--navy); font-variant-numeric: tabular-nums; }

  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .hist li:last-child { border-bottom: none; }
  .hist .h-main { flex: 1; min-width: 0; }
  .hist .h-num { font-weight: 700; color: var(--navy); }
  .hist .h-sub { color: var(--ink-faint); font-size: 11px; }
  .hist .h-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hist button { font: inherit; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--ink-soft); cursor: pointer; }
  .empty { font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .preview { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .preview-bar { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
  .preview-scroll { overflow-x: auto; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--navy); color: var(--surface); padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }

  /* Invoice paper: always white, shared by the preview and the PDF */
  .pdfdoc { --px: 44px; background: #FFFFFF; color: #24303F; font: 13.5px/1.5 "Helvetica Neue", Arial, sans-serif; padding-bottom: 20px; }
  #preview .pdfdoc { min-width: 640px; }
  .pdfdoc * { box-sizing: border-box; }
  .pdfdoc .top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 5px 20px; padding: 18px var(--px) 10px; }
  .pdfdoc .brand { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: #1E2A3A; text-transform: uppercase; }
  .pdfdoc .title { font-size: 22px; font-weight: 800; letter-spacing: .02em; color: #E8501F; text-transform: uppercase; }
  .pdfdoc .bar { height: 3px; background: #E8501F; }
  .pdfdoc .parties { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px var(--px) 0; }
  .pdfdoc .party { flex: 1; min-width: 200px; }
  .pdfdoc .lbl { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8A96A8; margin-bottom: 4px; }
  .pdfdoc .pname { font-size: 14px; font-weight: 700; color: #1E2A3A; margin-bottom: 2px; }
  .pdfdoc .pline { font-size: 12px; color: #55637A; }
  .pdfdoc .meta { display: flex; flex-wrap: wrap; gap: 6px 32px; padding: 20px var(--px) 0; }
  .pdfdoc .meta .val { font-size: 13px; font-weight: 700; color: #1E2A3A; }
  .pdfdoc .items { margin: 24px var(--px) 0; border: 1px solid #E3E8EF; border-radius: 8px 8px 0 0; overflow: hidden; }
  .pdfdoc .irow { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #E3E8EF; }
  .pdfdoc .irow:last-child { border-bottom: none; }
  .pdfdoc .ihead { background: #1E2A3A; padding: 8px 16px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #FFFFFF; }
  .pdfdoc .c-desc { flex: 1; min-width: 0; }
  .pdfdoc .c-qty { width: 50px; text-align: center; }
  .pdfdoc .c-rate { width: 90px; text-align: right; }
  .pdfdoc .c-amt { width: 100px; text-align: right; }
  .pdfdoc .irow:not(.ihead) .c-qty, .pdfdoc .irow:not(.ihead) .c-rate { font-size: 13px; color: #55637A; }
  .pdfdoc .irow:not(.ihead) .c-amt { font-size: 13px; font-weight: 700; color: #24303F; }
  .pdfdoc .iname { font-size: 13px; font-weight: 600; color: #24303F; }
  .pdfdoc .idet { font-size: 11.5px; color: #55637A; }
  .pdfdoc .totals { margin: 0 var(--px); border: 1px solid #E3E8EF; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
  .pdfdoc .trow { display: flex; justify-content: flex-end; gap: 20px; padding: 8px 16px; border-bottom: 1px solid #E3E8EF; }
  .pdfdoc .trow:last-child { border-bottom: none; }
  .pdfdoc .tl { width: 120px; text-align: right; font-size: 12px; font-weight: 600; color: #55637A; }
  .pdfdoc .tv { width: 100px; text-align: right; font-size: 13px; font-weight: 700; color: #24303F; }
  .pdfdoc .trow.grand { background: #FDEEE7; border-top: 2px solid #E8501F; }
  .pdfdoc .trow.grand .tl { color: #E8501F; font-weight: 700; font-size: 13px; }
  .pdfdoc .trow.grand .tv { color: #E8501F; font-weight: 800; font-size: 15px; }
  .pdfdoc .notes { margin: 24px var(--px) 0; padding: 14px 16px; border: 1px solid #E3E8EF; border-left: 3px solid #E8501F; border-radius: 8px; background: #FDEEE7; }
  .pdfdoc .notes .lbl { color: #E8501F; }
  .pdfdoc .notes p { margin: 0 0 4px; font-size: 12px; color: #55637A; }
  .pdfdoc .notes p:last-child { margin-bottom: 0; }
  .pdfdoc .foot { margin-top: 28px; padding: 10px var(--px) 0; border-top: 2px solid #E3E8EF; text-align: center; font-size: 10px; color: #8A96A8; }
</style>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">Automate305</div>
      <h1>Invoice Generator</h1>
    </div>
    <div class="badge" id="badge">Loading history</div>
  </div>

  <div class="layout">
    <div>
      <form class="panel" id="form" autocomplete="off">
        <h2>Invoice</h2>
        <div class="field">
          <label for="number">Invoice number</label>
          <input id="number" required pattern="A305-\d{3}">
          <div class="hint" id="numberHint">Assigned automatically. Saved to history only when the PDF downloads.</div>
        </div>
        <div class="row2">
          <div class="field"><label for="date">Invoice date</label><input type="date" id="date" required></div>
          <div class="field"><label for="dueDate">Due date (Net 7)</label><input type="date" id="dueDate" required></div>
        </div>
        <div class="row2">
          <div class="field"><label for="periodStart">Retainer period start</label><input type="date" id="periodStart" required></div>
          <div class="field"><label for="periodEnd">Retainer period end</label><input type="date" id="periodEnd" required></div>
        </div>

        <div class="rule"></div>
        <h2>Booked meetings ($300 each)</h2>
        <div class="row2">
          <div class="field"><label for="meetStart">Meetings held from</label><input type="date" id="meetStart"></div>
          <div class="field"><label for="meetEnd">Meetings held to</label><input type="date" id="meetEnd"></div>
        </div>
        <div class="field">
          <label for="qty">Qualified meetings held</label>
          <input type="number" id="qty" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="notes">Notes (one per line)</label>
          <textarea id="notes"></textarea>
        </div>

        <div class="rule"></div>
        <div class="total-line"><span>Amount due</span><b id="totalOut">$3,500.00</b></div>
        <button class="btn" id="downloadBtn" type="submit">Download PDF</button>
      </form>

      <div class="panel">
        <h2>Invoice history</h2>
        <div id="history"><span class="empty">Loading...</span></div>
      </div>
    </div>

    <div class="preview">
      <div class="preview-bar">Live preview</div>
      <div class="preview-scroll"><div id="preview"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  const RETAINER = 3500, RATE = 300;
  const SEED = {
    number: 'A305-001', date: '2026-11-23', dueDate: '2026-12-01',
    periodStart: '2026-11-23', periodEnd: '2026-12-22', meetingQty: 0, total: 3500,
    notes: ['Attached: W-9 and direct deposit details.',
            'Qualified meeting bonuses ($300/meeting) will be included in subsequent invoices as meetings are held.',
            'Thank you for your business.']
  };
  const $ = id => document.getElementById(id);
  const F = ['number', 'date', 'dueDate', 'periodStart', 'periodEnd', 'meetStart', 'meetEnd', 'qty', 'notes'];

  let db = null, downloads = null, history = [], connected = false, pristine = true, notesTouched = false, busy = false;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pad3 = n => String(n).padStart(3, '0');
  const numOf = s => parseInt(String(s).slice(5), 10) || 0;
  const parse = iso => new Date(iso + 'T12:00:00');
  const toISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const monthEnd = iso => { const d = parse(iso); d.setMonth(d.getMonth() + 1); d.setDate(d.getDate() - 1); return toISO(d); };
  const longDate = iso => iso ? parse(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
  const shortDate = iso => iso ? parse(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
  const shortYear = iso => iso ? parse(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const range = (a, b) => (a && b) ? shortDate(a) + ' - ' + shortYear(b) : '';
  const totalOf = d => RETAINER + (d.meetingQty || 0) * RATE;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function latest() {
    return history.reduce((best, d) => (!best || numOf(d.number) > numOf(best.number)) ? d : best, null) || SEED;
  }

  function defaultNotes(qty, ms, me) {
    const win = range(ms, me);
    if (qty > 0) return [qty + ' qualified meeting' + (qty === 1 ? '' : 's') + ' held ' + (win || 'during the period') + ', billed at $300/meeting.', 'Thank you for your business.'];
    return ['Qualified meeting bonuses ($300/meeting) are billed on the invoice after meetings are held.', 'Thank you for your business.'];
  }

  function applyDefaults() {
    const L = latest();
    const start = addDays(L.periodEnd, 1);
    $('number').value = 'A305-' + pad3(numOf(L.number) + 1);
    $('periodStart').value = start;
    $('periodEnd').value = monthEnd(start);
    $('date').value = start;
    $('dueDate').value = addDays(start, 7);
    $('meetStart').value = L.periodStart;
    $('meetEnd').value = L.periodEnd;
    $('qty').value = 0;
    $('notes').value = defaultNotes(0, L.periodStart, L.periodEnd).join('\n');
    pristine = true; notesTouched = false;
    render();
  }

  function readForm() {
    const d = {
      number: $('number').value.trim().toUpperCase(),
      date: $('date').value, dueDate: $('dueDate').value,
      periodStart: $('periodStart').value, periodEnd: $('periodEnd').value,
      meetStart: $('meetStart').value, meetEnd: $('meetEnd').value,
      meetingQty: Math.max(0, parseInt($('qty').value, 10) || 0),
      notes: $('notes').value.split('\n').map(s => s.trim()).filter(Boolean)
    };
    d.total = totalOf(d);
    return d;
  }

  function invoiceMarkup(d) {
    const qty = d.meetingQty || 0;
    const meetDetail = (d.meetStart && d.meetEnd) ? 'Qualified meetings held ' + range(d.meetStart, d.meetEnd) : 'Qualified meetings held during invoice period';
    const notes = (d.notes || []).map(n => '<p>' + esc(n) + '</p>').join('');
    return '<div class="pdfdoc">' +
      '<div class="top"><span class="brand">A305</span><span class="title">Invoice</span></div><div class="bar"></div>' +
      '<div class="parties">' +
        '<div class="party"><div class="lbl">From</div><div class="pname">Camilo Gonzalez / Automate305</div><div class="pline">12864 Biscayne Blvd., PMB #2203</div><div class="pline">North Miami, FL 33181</div><div class="pline">(305) 615-5199</div></div>' +
        '<div class="party"><div class="lbl">Bill To</div><div class="pname">FusionAuth</div><div class="pline">Attn: Accounts Payable</div><div class="pline">ap@fusionauth.io</div></div>' +
      '</div>' +
      '<div class="meta">' +
        '<div><div class="lbl">Invoice No.</div><div class="val">' + esc(d.number) + '</div></div>' +
        '<div><div class="lbl">Invoice Date</div><div class="val">' + esc(longDate(d.date)) + '</div></div>' +
        '<div><div class="lbl">Due Date</div><div class="val">' + esc(longDate(d.dueDate)) + '</div></div>' +
        '<div><div class="lbl">Terms</div><div class="val">Net 7</div></div>' +
      '</div>' +
      '<div class="items">' +
        '<div class="irow ihead"><div class="c-desc">Description</div><div class="c-qty">Qty</div><div class="c-rate">Rate</div><div class="c-amt">Amount</div></div>' +
        '<div class="irow"><div class="c-desc"><div class="iname">Monthly Retainer</div><div class="idet">Outbound engagement, fractional BDR services (' + esc(range(d.periodStart, d.periodEnd)) + ')</div></div><div class="c-qty">1</div><div class="c-rate">' + money(RETAINER) + '</div><div class="c-amt">' + money(RETAINER) + '</div></div>' +
        '<div class="irow"><div class="c-desc"><div class="iname">Booked Meetings</div><div class="idet">' + esc(meetDetail) + '</div></div><div class="c-qty">' + qty + '</div><div class="c-rate">' + money(RATE) + '</div><div class="c-amt">' + money(qty * RATE) + '</div></div>' +
      '</div>' +
      '<div class="totals"><div class="trow"><div class="tl">Subtotal</div><div class="tv">' + money(totalOf(d)) + '</div></div><div class="trow grand"><div class="tl">Amount Due</div><div class="tv">' + money(totalOf(d)) + '</div></div></div>' +
      (notes ? '<div class="notes"><div class="lbl">Notes</div>' + notes + '</div>' : '') +
      '<div class="foot">Camilo Gonzalez / Automate305 &middot; 12864 Biscayne Blvd., PMB #2203, North Miami, FL 33181 &middot; (305) 615-5199</div>' +
    '</div>';
  }

  function render() {
    const d = readForm();
    $('preview').innerHTML = invoiceMarkup(d);
    $('totalOut').textContent = money(d.total);
    const exists = history.some(h => h.number === d.number);
    const hint = $('numberHint');
    hint.className = exists ? 'hint warn' : 'hint';
    hint.textContent = exists ? d.number + ' is already in history. Downloading will replace that record.' : 'Assigned automatically. Saved to history only when the PDF downloads.';
    $('downloadBtn').textContent = exists ? 'Download PDF (reissue ' + d.number + ')' : 'Download PDF';
    const next = 'A305-' + pad3(numOf(latest().number) + 1);
    const badge = $('badge');
    badge.className = connected ? 'badge' : 'badge off';
    badge.textContent = connected ? 'Next number: ' + next : 'History not connected';
  }

  function renderHistory() {
    const el = $('history');
    if (!history.length) { el.innerHTML = '<span class="empty">No invoices yet</span>'; return; }
    const rows = history.slice().sort((a, b) => numOf(b.number) - numOf(a.number));
    el.innerHTML = '<ul class="hist">' + rows.map(d =>
      '<li><div class="h-main"><div class="h-num">' + esc(d.number) + '</div><div class="h-sub">' + esc(range(d.periodStart, d.periodEnd)) + ' &middot; ' + (d.meetingQty || 0) + ' mtg</div></div>' +
      '<span class="h-amt">' + money(totalOf(d)) + '</span><button type="button" data-num="' + esc(d.number) + '">PDF</button></li>'
    ).join('') + '</ul>';
  }

  async function makePdf(d) {
    if (!window.html2pdf) throw { code: 'lib', message: 'The PDF library did not load. Check your connection and reload.' };
    const holder = document.createElement('div');
    holder.innerHTML = invoiceMarkup(d);
    return window.html2pdf().set({
      margin: [0.35, 0.3, 0.4, 0.3],
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, scrollX: 0, scrollY: 0, backgroundColor: '#FFFFFF' },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
    }).from(holder.firstElementChild).outputPdf('blob');
  }

  async function savePdf(blob, filename) {
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); return true; }
      catch (e) {
        if (e && e.code === 'declined') toast('Download cancelled. Nothing was saved.');
        else if (e && e.code === 'rate_limited') toast('A save prompt is already open.');
        else if (e && e.code === 'host_unavailable') toast('This app cannot save files. Open the page in a browser.');
        else toast('Download is not available here.');
        return false;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }

  async function download(d, record) {
    if (busy) return;
    busy = true;
    const btn = $('downloadBtn'); btn.disabled = true;
    const label = btn.textContent; btn.textContent = 'Building PDF...';
    try {
      const blob = await makePdf(d);
      const ok = await savePdf(blob, 'Invoice_' + d.number + '_FusionAuth.pdf');
      if (!ok || !record) return;
      const doc = Object.assign({}, d, { createdAt: new Date().toISOString() });
      if (db) await db.collection('invoices').doc(d.number).set(doc);
      history = history.filter(h => h.number !== d.number).concat([doc]);
      renderHistory();
      applyDefaults();
      toast(d.number + ' downloaded and saved to history.');
    } catch (e) {
      toast((e && e.message) || 'Could not build the PDF.');
    } finally {
      busy = false; btn.disabled = false;
      if (btn.textContent === 'Building PDF...') btn.textContent = label;
      render();
    }
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const d = readForm();
    if (!/^A305-\d{3}$/.test(d.number)) { toast('Invoice number must look like A305-002.'); return; }
    if (!d.date || !d.dueDate || !d.periodStart || !d.periodEnd) { toast('Fill in all invoice and period dates.'); return; }
    download(d, true);
  });

  $('history').addEventListener('click', e => {
    const b = e.target.closest('button[data-num]');
    if (!b) return;
    const d = history.find(h => h.number === b.dataset.num);
    if (d) download(d, false);
  });

  F.forEach(id => $(id).addEventListener('input', () => {
    pristine = false;
    if (id === 'notes') notesTouched = true;
    if (!notesTouched && (id === 'qty' || id === 'meetStart' || id === 'meetEnd')) {
      $('notes').value = defaultNotes(Math.max(0, parseInt($('qty').value, 10) || 0), $('meetStart').value, $('meetEnd').value).join('\n');
    }
    render();
  }));

  applyDefaults();
  renderHistory();

  (async function connect() {
    try { downloads = window.claude && await window.claude.use('downloads'); } catch (e) { downloads = null; }
    try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) {
      history = [SEED];
      $('history').innerHTML = '<span class="empty">History is not connected in this view. Numbers are not tracked here.</span>';
      render();
      return;
    }
    const timer = setTimeout(() => { $('history').innerHTML = '<span class="empty">History cannot be reached yet. Still trying...</span>'; }, 10000);
    db.collection('invoices').limit(500).onSnapshot(snap => {
      clearTimeout(timer);
      connected = true;
      history = snap.docs.map(s => Object.assign({ number: s.id }, s.data()));
      renderHistory();
      if (pristine && !busy) applyDefaults(); else render();
    }, () => {
      clearTimeout(timer);
      $('history').innerHTML = '<span class="empty">History could not be loaded.</span>';
    });
  })();
})();
</script>
